name: SEO checks

# Builds the site and runs scripts/seo-validate.mjs against the output. It fails
# on hard errors only (missing title/canonical, broken internal links, noindex
# pages in the sitemap, collapsed sitemap ...); warnings are reported, not gated.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The build rewrites data/sitemap-lastmod.json when a page's content changed.
      # If that file is not committed, production would date those pages with the
      # deploy date instead of the date the content really changed.
      - name: sitemap lastmod manifest is committed
        run: git diff --exit-code -- data/sitemap-lastmod.json
      - run: node scripts/seo-validate.mjs
